[platformio]
default_envs = firebeetle2_esp32s3   ; plain `pio run` builds the firmware only

[common]
apriltag = https://github.com/AprilRobotics/apriltag.git#v3.3.0

[env:firebeetle2_esp32s3]
; pioarduino build of espressif32 — Arduino core 3.3.11 / ESP-IDF 5.5. Pinned:
; plain "espressif32" resolves to PlatformIO's platform (Arduino 2.x), which
; lacks the shared-I²C camera driver this firmware relies on.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = dfrobot_firebeetle2_esp32s3
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

; ── OPI PSRAM + 16 MB flash with two OTA slots ──────────────────────
; Camera frame buffers need PSRAM — must be OPI (octal) for this board.
; The board JSON assumes 4 MB flash; the N16R8 module has 16 MB, and any
; partition past 4 MB fails to boot unless the image header says so.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv   ; 2 × 6.25 MB app slots

; -O2 instead of the framework's -Os: favour AprilTag throughput over size
build_unflags = -Os
build_flags =
    -O2
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM

; Credentials: src/secrets.h (git-ignored) — see src/secrets.example.h.
; AXP313A and VQF live in lib/ so PlatformIO picks them up automatically.
; esp32-camera is bundled with the platform — no extra entry needed.
lib_deps =
    ${common.apriltag}
    ; OV5640 autofocus firmware blob + register map (MIT); control is in src/focus.cpp
    https://github.com/0015/ESP32-OV5640-AF.git#c4e6585c331886dfd2e79a7dda65c7a46443a9d1
    ; Espressif's SIMD JPEG decoder, ~5× the ROM decoder (Espressif MIT licence:
    ; Espressif chips only); manifest added by scripts/esp_new_jpeg_manifest.py
    esp_new_jpeg=https://components-file.espressif.com/components/espressif/esp_new_jpeg/1.0.2/espressif__esp_new_jpeg-v1.0.2.zip

; apriltag ships no PlatformIO manifest; this adds one that skips the Python
; bindings so a fresh clone (or CI) builds without manual patching.
extra_scripts =
    pre:scripts/apriltag_manifest.py
    pre:scripts/esp_new_jpeg_manifest.py
    pre:scripts/embed_web.py   ; web/index.html → src/generated/web_index.h
    pre:scripts/version.py     ; git describe → src/generated/version.h

; ── Unit tests on the build machine: pio test -e native (task test) ─
; The pure maths in src/camera_model.h and src/tag_pose.h, run against the
; real apriltag library — no board needed.
[env:native]
platform = native@1.2.1
test_framework = unity
lib_deps = ${common.apriltag}
build_flags =
    -std=gnu++17
    -Isrc
    -DUNITY_INCLUDE_DOUBLE
    -lpthread
    -lm
extra_scripts = pre:scripts/apriltag_manifest.py
