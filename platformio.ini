[env:firebeetle2_esp32s3]
platform  = espressif32
board     = dfrobot_firebeetle2_esp32s3
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

; ── OPI PSRAM + large app partition ─────────────────────────────────
; Camera frame buffers need PSRAM — must be OPI (octal) for this board.
; "huge_app" gives ~3MB for app code, enough for the camera+HTTP stack.
board_build.arduino.memory_type = qio_opi
board_build.partitions          = huge_app.csv

build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM

; AXP313A lives in lib/ so PlatformIO picks it up automatically.
; esp32-camera is bundled with the espressif32 platform — no extra entry needed.
lib_deps =
    ; nothing external required — camera driver is in the platform
