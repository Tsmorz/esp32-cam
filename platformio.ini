[env:firebeetle2_esp32s3]
; pioarduino build of espressif32 — Arduino core 3.3.11 / ESP-IDF 5.5. Pinned:
; plain "espressif32" resolves to PlatformIO's platform (Arduino 2.x), which
; lacks the shared-I²C camera driver this firmware relies on.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = dfrobot_firebeetle2_esp32s3
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600

; ── OPI PSRAM + 16 MB flash with two OTA slots ──────────────────────
; Camera frame buffers need PSRAM — must be OPI (octal) for this board.
; The board JSON assumes 4 MB flash; the N16R8 module has 16 MB, and any
; partition past 4 MB fails to boot unless the image header says so.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv   ; 2 × 6.25 MB app slots

; -O2 instead of the framework's -Os: favour AprilTag throughput over size
build_unflags = -Os
build_flags =
    -O2
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM

; Credentials: src/secrets.h (git-ignored) — see src/secrets.example.h.
; AXP313A and VQF live in lib/ so PlatformIO picks them up automatically.
; esp32-camera is bundled with the platform — no extra entry needed.
lib_deps =
    https://github.com/AprilRobotics/apriltag.git#v3.3.0
    ; OV5640 autofocus firmware blob + register map (MIT); control is in src/focus.cpp
    https://github.com/0015/ESP32-OV5640-AF.git#c4e6585c331886dfd2e79a7dda65c7a46443a9d1

; apriltag ships no PlatformIO manifest; this adds one that skips the Python
; bindings so a fresh clone (or CI) builds without manual patching.
extra_scripts =
    pre:scripts/apriltag_manifest.py
    pre:scripts/embed_web.py   ; web/index.html → src/generated/web_index.h
