version: '3'

# ESP-IDF v5.5.5 build. scripts/idf.sh loads its environment, so no
# `. export.sh` needed first. USB tasks take an optional PORT=/dev/cu.…
vars:
  IDF: scripts/idf.sh
  CPPCHECK_VERSION: 2.22.0
  SOURCES: main/*.cpp main/*.h components/DFRobot_AXP313A/include/*.h components/VQF/include/*.hpp test/*/*.cpp
  PORT_ARG: '{{if .PORT}}-p {{.PORT}}{{end}}'

tasks:
  init:
    desc: "First-time setup: check tools, create main/secrets.h, fetch the components"
    cmds:
      - |
        missing=0
        for tool in cmake clang-format cppcheck; do
          command -v $tool >/dev/null || { echo "MISSING: $tool"; missing=1; }
        done
        if [ $missing = 1 ]; then
          echo "Install with: brew install cmake ninja clang-format cppcheck"
          exit 1
        fi
        clang-format --version | grep -q 'version 21\.' || \
          echo "WARNING: CI uses clang-format 21.x, you have: $(clang-format --version)"
        cppcheck --version | grep -q '{{.CPPCHECK_VERSION}}' || \
          echo "WARNING: CI uses cppcheck {{.CPPCHECK_VERSION}}, you have: $(cppcheck --version)"
      - |
        if [ -f main/secrets.h ]; then
          echo "main/secrets.h exists"
        else
          cp main/secrets.example.h main/secrets.h
          echo "Created main/secrets.h — uncomment and set what you want (all optional)"
        fi
      - "{{.IDF}} reconfigure"
      - echo "Ready. Next{{":"}} task ci"

  smoke:
    desc: "Check the running board over the network (after an OTA). Pass options after --, e.g. task smoke -- -H 192.168.1.50"
    cmds:
      - python3 scripts/smoke_test.py {{.CLI_ARGS}}

  ota-rollback-test:
    desc: "Flash a deliberately crashing image over OTA and check the board rolls back. Options after --"
    cmds:
      - python3 scripts/test_ota_rollback.py {{.CLI_ARGS}}

  build:
    desc: "Compile firmware → build/wifi-camera.bin (OTA) and build/wifi-camera-factory.bin (blank board, offset 0x0)"
    cmds:
      - "{{.IDF}} build"
      - "{{.IDF}} merge-bin -o wifi-camera-factory.bin"

  size:
    desc: "Memory use per component"
    cmds:
      - "{{.IDF}} size-components"

  menuconfig:
    desc: "Browse the configuration (copy what you change into sdkconfig.defaults)"
    interactive: true
    cmds:
      - "{{.IDF}} menuconfig"

  test:
    desc: "Unit tests on this machine (token rules, JSON helpers, VQF + compass, MOV, detection) — no board needed"
    cmds:
      - cmake -S test -B build-test -DCMAKE_BUILD_TYPE=Debug
      - cmake --build build-test
      - ctest --test-dir build-test --output-on-failure

  flash:
    desc: "Flash over USB, then open the serial monitor — Ctrl+] to exit"
    interactive: true
    cmds:
      - pkill -f "idf.py.*monitor" || true
      - "{{.IDF}} {{.PORT_ARG}} flash monitor"

  monitor:
    desc: "Open serial monitor only (no reflash) — Ctrl+] to exit"
    interactive: true
    cmds:
      - "{{.IDF}} {{.PORT_ARG}} monitor"

  check:
    desc: "Static analysis (cppcheck {{.CPPCHECK_VERSION}}) — fails on errors and warnings"
    cmds:
      # dangerousTypeCast (C casts in socket/NVS calls) and
      # uninitMemberVarNoCtor (plain aggregates) are style, not defects
      - >-
        cppcheck --std=c++17 --language=c++ --enable=warning --inline-suppr
        --suppress=missingIncludeSystem --suppress=dangerousTypeCast
        --suppress=uninitMemberVarNoCtor --error-exitcode=1 --quiet
        --template='{file}:{line}: {severity} ({id}): {message}'
        -I main -I components/VQF/include -I components/DFRobot_AXP313A/include
        main components/VQF components/DFRobot_AXP313A

  format:
    desc: "Format all sources with clang-format"
    cmds:
      - clang-format -i {{.SOURCES}}

  format-check:
    desc: "Fail if any source isn't clang-formatted"
    cmds:
      - |
        clang-format --dry-run --Werror {{.SOURCES}} || (echo "ERROR: run 'task format' and re-commit" && exit 1)

  ci:
    desc: "Run the CI jobs locally: format-check, check, test, build"
    cmds:
      - task: format-check
      - task: check
      - task: test
      - task: build

  clean:
    desc: "Remove build artifacts (full rebuild next time)"
    cmds:
      - "{{.IDF}} fullclean"
      - rm -rf build-test

  factory:
    desc: "Erase all flash over USB — clears saved WiFi and the password (reflash afterwards)"
    interactive: true
    cmds:
      - "{{.IDF}} {{.PORT_ARG}} erase-flash"
