version: '3'

vars:
  ENV: firebeetle2_esp32s3

tasks:
  build:
    desc: "Compile firmware"
    cmds:
      - pio run -e {{.ENV}}

  flash:
    desc: "Flash firmware, then open serial monitor — Ctrl+C to exit"
    cmds:
      - pio run -e {{.ENV}} -t clean -t upload
      - pio device monitor -e {{.ENV}}

  monitor:
    desc: "Open serial monitor only (no reflash) — Ctrl+C to exit"
    cmds:
      - pio device monitor -e {{.ENV}}

  check:
    desc: "Run PlatformIO static analysis / cppcheck"
    cmds:
      - pio check -e {{.ENV}} --skip-packages --fail-on-defect high

  format:
    desc: "Format source files with clang-format"
    cmds:
      - clang-format -i src/main.cpp lib/DFRobot_AXP313A/DFRobot_AXP313A.h

  ci:
    desc: "Run all CI stages locally: format, check, build"
    cmds:
      - |
        set -e
        task format
        git diff --exit-code || (echo "ERROR: clang-format changed files — stage them and re-commit" && exit 1)
        task check
        task build

  factory:
    desc: "Erase all flash — clears saved WiFi credentials"
    cmds:
      - pio run -e {{.ENV}} --target erase
