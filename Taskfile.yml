version: '3'

vars:
  ENV: firebeetle2_esp32s3
  SOURCES: src/*.cpp src/*.h lib/*/*.h lib/*/*.hpp test/*/*.cpp

tasks:
  init:
    desc: "First-time setup: check tools, create src/secrets.h, fetch toolchains and libraries"
    cmds:
      - |
        missing=0
        for tool in pio clang-format; do
          command -v $tool >/dev/null || { echo "MISSING: $tool"; missing=1; }
        done
        if [ $missing = 1 ]; then
          echo "Install with: pip install platformio==6.1.19 clang-format==21.1.8  (or brew install clang-format)"
          exit 1
        fi
        clang-format --version | grep -q 'version 21\.' || \
          echo "WARNING: CI uses clang-format 21.x, you have: $(clang-format --version)"
      - |
        if [ -f src/secrets.h ]; then
          echo "src/secrets.h exists"
        else
          cp src/secrets.example.h src/secrets.h
          echo "Created src/secrets.h — edit WIFI_SSID, WIFI_PASS and API_TOKEN"
        fi
      - pio pkg install -e {{.ENV}}
      - pio pkg install -e native
      - echo "Ready. Next{{":"}} task ci"

  smoke:
    desc: "Check the running board over the network (after an OTA). Pass options after --, e.g. task smoke -- -H 192.168.1.50"
    cmds:
      - python3 scripts/smoke_test.py {{.CLI_ARGS}}

  ota-rollback-test:
    desc: "Flash a deliberately crashing image over OTA and check the board rolls back. Options after --"
    cmds:
      - python3 scripts/test_ota_rollback.py {{.CLI_ARGS}}

  build:
    desc: "Compile firmware"
    cmds:
      - pio run -e {{.ENV}}

  test:
    desc: "Unit tests on this machine (token rules, VQF + compass) — no board needed"
    cmds:
      - pio test -e native

  flash:
    desc: "Flash firmware, then open serial monitor — Ctrl+C to exit"
    cmds:
      - pkill -f "pio device monitor" || true
      - pio run -e {{.ENV}} -t upload
      - pio device monitor -e {{.ENV}}

  monitor:
    desc: "Open serial monitor only (no reflash) — Ctrl+C to exit"
    cmds:
      - pio device monitor -e {{.ENV}}

  check:
    desc: "Static analysis (cppcheck) — fails on HIGH or MEDIUM findings"
    cmds:
      - pio check -e {{.ENV}} --skip-packages --fail-on-defect high --fail-on-defect medium

  format:
    desc: "Format all sources with clang-format"
    cmds:
      - clang-format -i {{.SOURCES}}

  format-check:
    desc: "Fail if any source isn't clang-formatted"
    cmds:
      - |
        clang-format --dry-run --Werror {{.SOURCES}} || (echo "ERROR: run 'task format' and re-commit" && exit 1)

  ci:
    desc: "Run the CI jobs locally: format-check, check, test, build"
    cmds:
      - task: format-check
      - task: check
      - task: test
      - task: build

  clean:
    desc: "Remove build artifacts (full rebuild next time)"
    cmds:
      - pio run -e {{.ENV}} -t clean

  factory:
    desc: "Erase all flash — clears saved WiFi credentials (reflash afterwards)"
    cmds:
      - pio run -e {{.ENV}} --target erase
