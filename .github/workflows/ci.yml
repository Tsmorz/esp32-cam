name: CI

# format ─┐
# analyze ├─► release   (only for a pushed v* tag)
# test ───┤
# build ──┘
#
# Every job runs the same `task` command you run locally (Taskfile.yml).

on:
  push: # branches and tags
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

defaults:
  run:
    shell: bash # explicit, so steps run with -eo pipefail (build | tee)

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Same clang-format major as local dev, so formatting agrees
      - run: pip install clang-format==21.1.8
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - run: task format-check

  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-platformio
      - run: task check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-platformio
      - run: task test

  build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the version string (git describe)
      - uses: ./.github/actions/setup-platformio

      # No secrets.h in CI: config.h falls back to empty credentials
      - run: task build | tee build.log

      - name: Size report
        run: |
          {
            echo "### Firmware $(sed -n 's/#define FW_VERSION "\(.*\)"/\1/p' src/generated/version.h)"
            echo '```'
            grep -E '^(RAM|Flash):' build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            .pio/build/firebeetle2_esp32s3/firmware.bin
            .pio/build/firebeetle2_esp32s3/firmware.factory.bin
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format, analyze, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The exact binaries the build job produced and the other jobs vetted
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      - name: Name assets after the tag
        working-directory: dist
        run: |
          name="${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}"
          mv firmware.bin "$name.bin"                 # OTA / dashboard upload
          mv firmware.factory.bin "$name-factory.bin" # blank board, offset 0x0
          sha256sum *.bin > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease) # v1.2.0-rc1
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes --verify-tag "${flags[@]}"
