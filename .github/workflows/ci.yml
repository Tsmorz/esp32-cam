name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install tools
        # Same clang-format major as local dev, so formatting agrees
        run: pip install platformio clang-format==21.1.8

      - name: clang-format
        run: clang-format --dry-run --Werror src/*.cpp src/*.h lib/*/*.h lib/*/*.hpp

      # No secrets.h in CI: config.h falls back to empty credentials
      - name: Build
        run: pio run -e firebeetle2_esp32s3
